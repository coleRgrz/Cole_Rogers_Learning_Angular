<form [formGroup]="personForm" (ngSubmit)="onSubmit()" class="mat-form">
  <mat-form-field appearance="outline" matTooltip="Person's ID" class="form-field" disabled>
    <mat-label>ID</mat-label>
    <input matInput type="number" formControlName="id" />
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Person's name" class="form-field">
    <mat-label>Name</mat-label>
    <input matInput type="text" formControlName="name" appAutoFocus />
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Person's age" class="form-field">
    <mat-label>Age</mat-label>
    <input matInput type="number" formControlName="age"/>
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Person's favourite food" class="form-field">
    <mat-label>Favourite Food</mat-label>
    <input matInput type="text" formControlName="faveFood"/>
  </mat-form-field>

  <mat-form-field appearance="outline" matTooltip="Person's hair colour" class="form-field">
    <mat-label>Hair Colour</mat-label>
    <input matInput type="text" formControlName="hairColour" />
  </mat-form-field>

  <mat-checkbox formControlName="isTeamLead" matTooltip="Is person a team lead?" class="checkbox">Is Team Lead</mat-checkbox>

  <mat-form-field appearance="outline" matTooltip="A picture of the person would go here" class="form-field">
    <mat-label>Image</mat-label>
    <input matInput type="text" formControlName="img" >
  </mat-form-field>

  <div class="button-group">
    <button mat-raised-button color="accent" matTooltip="Add a new person" type="submit">Add</button>

    <button mat-raised-button color="primary" matTooltip="Edit an existing person" type="button" (click)="onEdit()">Edit</button>

    <button mat-raised-button color="warn" matTooltip="Delete an existing person" type="button" (click)="onDelete()">Delete</button>

    <button mat-raised-button matTooltip="Go back to list of people" type="button" (click)="navigateToPersonList()">Back to List</button>
  </div>

  <div *ngIf="error" class="error mat-error">{{ error }}</div>
</form>
