<form [formGroup]="personForm" (ngSubmit)="onSubmit()" class="mat-form">
  <mat-form-field appearance="outline" class="form-field" disabled>
    <mat-label>ID</mat-label>
    <input matInput type="number" formControlName="id" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Name</mat-label>
    <input matInput type="text" formControlName="name" appAutoFocus />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Age</mat-label>
    <input matInput type="number" formControlName="age"/>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Favourite Food</mat-label>
    <input matInput type="text" formControlName="faveFood"/>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Hair Colour</mat-label>
    <input matInput type="text" formControlName="hairColour" />
  </mat-form-field>

  <mat-checkbox formControlName="isTeamLead" class="checkbox">Is Team Lead</mat-checkbox>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Image</mat-label>
    <input matInput type="text" formControlName="img" >
  </mat-form-field>

  <div class="button-group">
    <button mat-raised-button color="accent" type="submit">Add</button>

    <button mat-raised-button color="primary" type="button" (click)="onEdit()">Edit</button>

    <button mat-raised-button color="warn" type="button" (click)="onDelete()">Delete</button>

    <button mat-raised-button type="button" (click)="navigateToPersonList()">Back to List</button>
  </div>

  <div *ngIf="error" class="error mat-error">{{ error }}</div>
</form>
